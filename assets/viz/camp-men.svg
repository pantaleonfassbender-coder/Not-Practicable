<text x="609" y="210" font-size="11.5" font-weight="bold" text-anchor="middle" fill="var(--ink)">5</text>
<a href="#/text/camp/work/1"><text x="456" y="330" font-size="12.5" fill="var(--ink)" text-decoration="underline">5. Apr.–June 1936: about 6,000</text></a>
<circle cx="716" cy="80" r="6" fill="var(--panel)" stroke="var(--survey)" stroke-width="2"/>
<text x="716" y="98" font-size="11.5" font-weight="bold" text-anchor="middle" fill="var(--ink)">6</text>
<a href="#/text/camp/work/3"><text x="456" y="352" font-size="12.5" fill="var(--ink)" text-decoration="underline">6. expected 1936: 20,000 at the peak</text></a>
<circle cx="803" cy="230" r="5" fill="var(--work)"/>
