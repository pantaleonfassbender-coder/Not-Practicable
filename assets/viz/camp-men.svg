<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="cm-t cm-d" font-family="var(--serif)">
<title id="cm-t">Men on the canal, as reported and as promised</title><desc id="cm-d">Reported: 14 Sept 1935: first ground, 100 men; by 20 Sept: 1,750 at Camp Roosevelt; 1 Oct: 3,000 employed; Apr.–June 1936: about 6,000; 8 July 1936: about 5,000 left unemployed. Promised: promised Sept 1935: 7,000 within four months; expected 1936: 20,000 at the peak.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Men on the canal, as reported and as promised</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">September 1935 to July 1936. Filled dots: numbers reported at the time; open dots: numbers promised. The list below links to the passages.</text>
<line x1="70" x2="860" y1="280" y2="280" stroke="var(--line)"/><text x="64" y="284" font-size="11" text-anchor="end" fill="var(--ink2)">0</text>
<line x1="70" x2="860" y1="230" y2="230" stroke="var(--line)"/><text x="64" y="234" font-size="11" text-anchor="end" fill="var(--ink2)">5,000</text>
<line x1="70" x2="860" y1="180" y2="180" stroke="var(--line)"/><text x="64" y="184" font-size="11" text-anchor="end" fill="var(--ink2)">10,000</text>
<line x1="70" x2="860" y1="130" y2="130" stroke="var(--line)"/><text x="64" y="134" font-size="11" text-anchor="end" fill="var(--ink2)">15,000</text>
<line x1="70" x2="860" y1="80" y2="80" stroke="var(--line)"/><text x="64" y="84" font-size="11" text-anchor="end" fill="var(--ink2)">20,000</text>
<text x="70" y="298" font-size="11" text-anchor="middle" fill="var(--ink2)">Sept 1935</text>
<text x="214" y="298" font-size="11" text-anchor="middle" fill="var(--ink2)">Nov</text>
<text x="357" y="298" font-size="11" text-anchor="middle" fill="var(--ink2)">Jan 1936</text>
<text x="501" y="298" font-size="11" text-anchor="middle" fill="var(--ink2)">Mar</text>
<text x="645" y="298" font-size="11" text-anchor="middle" fill="var(--ink2)">May</text>
<text x="788" y="298" font-size="11" text-anchor="middle" fill="var(--ink2)">July</text>
<polyline points="102,279 113,262 142,250 609,220 803,230" fill="none" stroke="var(--work)" stroke-width="2"/>
<circle cx="102" cy="279" r="5" fill="var(--work)"/>
<text x="102" y="269" font-size="11.5" font-weight="bold" text-anchor="middle" fill="var(--ink)">1</text>
<a href="#/text/camp/start/2"><text x="16" y="330" font-size="12.5" fill="var(--ink)" text-decoration="underline">1. 14 Sept 1935: first ground, 100 men</text></a>
<circle cx="113" cy="262" r="5" fill="var(--work)"/>
<text x="113" y="280" font-size="11.5" font-weight="bold" text-anchor="middle" fill="var(--ink)">2</text>
<a href="#/text/camp/start/2"><text x="16" y="352" font-size="12.5" fill="var(--ink)" text-decoration="underline">2. by 20 Sept: 1,750 at Camp Roosevelt</text></a>
<circle cx="142" cy="250" r="5" fill="var(--work)"/>
<text x="142" y="240" font-size="11.5" font-weight="bold" text-anchor="middle" fill="var(--ink)">3</text>
<a href="#/text/camp/start/3"><text x="16" y="374" font-size="12.5" fill="var(--ink)" text-decoration="underline">3. 1 Oct: 3,000 employed</text></a>
<circle cx="400" cy="210" r="6" fill="var(--panel)" stroke="var(--survey)" stroke-width="2"/>
<text x="400" y="228" font-size="11.5" font-weight="bold" text-anchor="middle" fill="var(--ink)">4</text>
<a href="#/text/camp/start/4"><text x="16" y="396" font-size="12.5" fill="var(--ink)" text-decoration="underline">4. promised Sept 1935: 7,000 within four months</text></a>
